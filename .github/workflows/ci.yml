name: CI

on:
  push:
  pull_request:
  # A larger run of the H3 property tests, from the Actions tab.
  workflow_dispatch:
    inputs:
      property-runs:
        description: Cases the H3 property tests try
        default: "500"
      property-seed:
        description: Their seed
        default: "1"

jobs:
  # The tests run in three shards per Node version: vitest runs files in
  # parallel but each file alone, and a runner has few cores.
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.shard == 1
        run: npm run check
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # H4: a fresh clone runs a saved Workflow through the pinfold command,
  # linked from the clone and through npx from the package as published.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm link
      - working-directory: examples/smoke
        run: pinfold run count_unresolved --project web
      - run: npm unlink -g pinfold && npm pack
      - working-directory: examples/smoke
        run: npx --yes --package "$GITHUB_WORKSPACE/pinfold-0.0.0.tgz" pinfold run count_unresolved --project web

  property:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run no-unreviewed-writes
        env:
          PINFOLD_PROPERTY_RUNS: ${{ inputs.property-runs }}
          PINFOLD_PROPERTY_SEED: ${{ inputs.property-seed }}
